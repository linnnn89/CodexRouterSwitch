name: Windows build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build enhanced EXE
        shell: powershell
        run: |
          $result = powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File .\Build-Exe.ps1 | ConvertFrom-Json
          if (-not $result.Ok) {
            throw "Build-Exe.ps1 did not report success."
          }
          if ($result.EntryPoint -ne "CodexRouterSwitch.EnhancedProgram") {
            throw "Unexpected EXE entry point: $($result.EntryPoint)"
          }
          if (-not (Test-Path -LiteralPath $result.Output -PathType Leaf)) {
            throw "The expected EXE was not created."
          }
          "EXE_PATH=$($result.Output)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Instantiate enhanced UI without displaying it
        shell: powershell
        run: |
          $resultFile = Join-Path $env:RUNNER_TEMP "enhanced-gui-self-test.json"
          $process = Start-Process `
            -FilePath $env:EXE_PATH `
            -ArgumentList @("--gui-self-test-file", $resultFile) `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "GUI self-test failed with exit code $($process.ExitCode)."
          }
          if (-not (Test-Path -LiteralPath $resultFile -PathType Leaf)) {
            throw "GUI self-test did not create its result file."
          }
          $result = Get-Content -LiteralPath $resultFile -Raw | ConvertFrom-Json
          if (
            -not $result.ok -or
            -not $result.enhancedUi -or
            $result.windowDisplayed -or
            $result.mutationsPerformed
          ) {
            throw "Enhanced GUI self-test returned an unexpected result."
          }
